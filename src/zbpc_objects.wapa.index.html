<!DOCTYPE html>                                                                                                                                                                                                                                                
<html lang="en">                                                                                                                                                                                                                                               
<head>                                                                                                                                                                                                                                                         
  <meta charset="utf-8">                                                                                                                                                                                                                                       
  <meta name="viewport" content="width=device-width, initial-scale=1">                                                                                                                                                                                         
  <title>BPC Object Manager</title>                                                                                                                                                                                                                            
  <style>                                                                                                                                                                                                                                                      
    html, body, #content { height: 100%; margin: 0; }                                                                                                                                                                                                          
  </style>                                                                                                                                                                                                                                                     
  <script>                                                                                                                                                                                                                                                     
    (function () {                                                                                                                                                                                                                                             
      var sTheme = "sap_belize";                                                                                                                                                                                                                               
      try {                                                                                                                                                                                                                                                    
        var sSaved = window.localStorage.getItem("bpcObjects.theme");                                                                                                                                                                                          
        if (sSaved === "sap_belize" || sSaved === "sap_belize_plus") { sTheme = sSaved; }                                                                                                                                                                      
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) { sTheme = "sap_belize_plus"; }                                                                                                                               
      } catch (e) { /* storage may be unavailable; fall back to the light theme */ }                                                                                                                                                                           
      window["sap-ui-config"] = { theme: sTheme };                                                                                                                                                                                                             
    })();                                                                                                                                                                                                                                                      
  </script>                                                                                                                                                                                                                                                    
  <script id="sap-ui-bootstrap"                                                                                                                                                                                                                                
    src="/sap/public/bc/ui5_ui5/resources/sap-ui-core.js"                                                                                                                                                                                                      
    data-sap-ui-libs="sap.m"                                                                                                                                                                                                                                   
    data-sap-ui-compatVersion="edge"                                                                                                                                                                                                                           
    data-sap-ui-resourceroots='{"chorus.bpc.objects": "./"}'>                                                                                                                                                                                                  
  </script>                                                                                                                                                                                                                                                    
  <script>                                                                                                                                                                                                                                                     
    sap.ui.getCore().attachInit(function () {                                                                                                                                                                                                                  
      sap.ui.require(["sap/ui/core/ComponentContainer"], function (ComponentContainer) {                                                                                                                                                                       
        new ComponentContainer({                                                                                                                                                                                                                               
          name: "chorus.bpc.objects",                                                                                                                                                                                                                          
          height: "100%"                                                                                                                                                                                                                                       
        }).placeAt("content");                                                                                                                                                                                                                                 
      });                                                                                                                                                                                                                                                      
    });                                                                                                                                                                                                                                                        
  </script>                                                                                                                                                                                                                                                    
</head>                                                                                                                                                                                                                                                        
<body class="sapUiBody sapUiSizeCozy" id="content">                                                                                                                                                                                                            
</body>                                                                                                                                                                                                                                                        
</html>
